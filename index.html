<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Elementa</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0055ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="data:,">

  <script src="theme-boot.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
  
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>
    <div class="logo-group">
      <div class="logo-mark"><img src="icon-192.png" alt="E" class="logo-icon" /></div>
      <span class="logo-text">Elementa</span>
    </div>
    <div class="header-actions">
      <div class="chem-toggle" id="theme-toggle" role="button" tabindex="0" aria-label="Toggle Theme">
        <div class="chem-toggle-track">
          <div class="chem-toggle-bubble">
            <div class="chem-toggle-flask">
              <svg viewBox="0 0 24 32" width="14" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="flask-outline" d="M8 2V12L3 24C2.5 25.2 3.4 26.5 4.7 26.5H19.3C20.6 26.5 21.5 25.2 21 24L16 12V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="6" y1="2" x2="18" y2="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path class="flask-liquid" d="M8 17C8 17 6 20 5 22C4.2 23.6 5.2 25 6.5 25H17.5C18.8 25 19.8 23.6 19 22C18 20 16 17 16 17H8Z"/>
              </svg>
            </div>
          </div>
          <div class="chem-toggle-sun-moon"></div>
        </div>
        <span class="chem-toggle-label">Light</span>
      </div>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="app-sidebar">
    <nav class="sidebar-nav" id="app-nav">
      </nav>
    <div class="sidebar-footer">
      <button class="collapse-btn" id="sidebar-collapse-btn">
        <span class="collapse-label">Collapse</span>
        <span class="chev">‹</span>
      </button>
    </div>
  </aside>

  <div class="app-main" id="app-main">
    <div class="container">
      <main id="app-views">
        </main>

      <footer class="footer-note">
        Elementa v4 &middot; Made For Students.
      </footer>
    </div>
  </div>

  <div class="modal-overlay" id="pt-modal">
    <div class="modal-content" id="pt-modal-content">
      <button class="modal-close" id="pt-modal-close-btn">&times;</button>
      <div id="pt-modal-body"></div>
    </div>
  </div>

  <script src="shell.js"></script>
  <script type="module" src="features.js"></script>
</body>
</html>
